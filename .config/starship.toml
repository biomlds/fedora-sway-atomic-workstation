add_newline = true
command_timeout = 1000
palette = "catppuccin_mocha"
format = "$os$username$hostname$directory$git_branch$git_status$fill$cmd_duration$jobs$container$line_break$character"

[fill]
symbol = " "

[character]
success_symbol = "[❯](sapphire)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[os]
disabled = false
style = "sapphire"

[os.symbols]
Fedora = " "
Linux = " "

[username]
show_always = false
style_user = "lavender"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "blue"
format = "[$hostname]($style) "

[directory]
style = "bold sapphire"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "mauve"

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 1000
style = "yellow"
format = "[󱎫 $duration]($style) "

[jobs]
symbol = "󰜎 "
style = "green"

[container]
symbol = "󰆧 "
style = "teal"
format = "[$symbol$name]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
