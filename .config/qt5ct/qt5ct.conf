# qt5ct settings for non-KDE Qt applications.
#
# qt5ct is read by any Qt5 application launched with
# QT_QPA_PLATFORMTHEME=qt5ct. It is NOT applied to Flatpak applications by
# default: inside a Flatpak sandbox XDG_CONFIG_HOME points at
# ~/.var/app/<app-id>/config, and the theme plugin has to be present in the
# sandbox before the setting means anything.
#
# This repository deliberately does not add a blanket `flatpak override` for
# this. See docs/THEMING.md for the per-application recipe and the caveats.
#
# File: ~/.config/qt5ct/qt5ct.conf
[General]
color_scheme=catppuccin-mocha-sapphire.conf
style=Fusion
