# Catppuccin Mocha with Sapphire accent, for qt5ct.
#
# Upstream : https://github.com/catppuccin/qt5ct
#            themes/catppuccin-mocha-sapphire.conf
# File     : ~/.config/qt5ct/colors/catppuccin-mocha-sapphire.conf
#
# qt5ct writes colours as eight-digit #AARRGGBB: two hex digits of alpha
# followed by the six-digit RGB value. Four upstream values are not Catppuccin
# Mocha palette colours, so they are mapped onto the nearest palette entry to
# keep this repository strictly palette-only:
#
#   pure white (ff + ffffff)          -> text       (ff + cdd6f4)
#   desaturated subtext0 (ff + a9bcdb) -> overlay0   (ff + 6c7086)
#   desaturated surface2 (ff + c7cceb) -> surface1   (ff + 585b70)
#
# The remaining semi-transparent entry (alpha 80 over overlay0) is kept as-is:
# the translucency is the point, and overlay0 is a palette colour.
[ColorScheme]
active_colors=  #ffcdd6f4,     #ff45475a, #ff585b70, #ff313244, #ff11111b, #ff181825, #ffcdd6f4,     #ffcdd6f4,  #ffcdd6f4,     #ff1e1e2e, #ff181825, #ff11111b, #ff74c7ec, #ff11111b,    #ff89b4fa,     #ffb4befe,   #ff181825, #ffcdd6f4, #ff1e1e2e, #ffcdd6f4, #806c7086, #ff74c7ec
inactive_colors=#ff7f849c, #ff1e1e2e,     #ff45475a, #ff313244, #ff11111b, #ff181825, #ff7f849c, #ffcdd6f4,  #ff7f849c, #ff1e1e2e, #ff181825, #ff11111b, #ff313244,              #ff7f849c, #ff7f849c, #ff7f849c,   #ff181825, #ffcdd6f4, #ff1e1e2e, #ffcdd6f4, #806c7086, #ff313244
disabled_colors=#ff6c7086, #ff313244, #ff45475a, #ff313244, #ff11111b, #ff181825, #ff6c7086, #ffcdd6f4,  #ff6c7086, #ff1e1e2e, #ff181825, #ff11111b, #ff181825,                #ff6c7086, #ff6c7086,   #ff585b70, #ff181825, #ffcdd6f4, #ff1e1e2e, #ffcdd6f4, #806c7086, #ff181825
