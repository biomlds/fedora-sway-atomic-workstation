# Waybar and swayidle are owned by Fedora:
#   /etc/sway/config.d/90-bar.conf      -> bar { swaybar_command waybar }
#   /etc/sway/config.d/90-swayidle.conf  -> swayidle -w, reads $lock_timeout/$screen_timeout
# Starting them here as well would run a second, unmanaged instance of each.
exec_always --no-startup-id sh -c 'pkill -x dunst || true; exec dunst'
exec_always --no-startup-id sh -c 'pkill -x kanshi || true; exec kanshi'
