# Idle and screen-off policy for the swayidle instance started by
# /etc/sway/config.d/90-swayidle.conf, which passes these as $lock_timeout and
# $screen_timeout and falls back to 300/60 when they are unset.
# Lock after 5 minutes idle, power outputs off 5 minutes later, and keep them off
# for a further 5 minutes while the screen stays locked.
set $lock_timeout 300
set $screen_timeout 300
